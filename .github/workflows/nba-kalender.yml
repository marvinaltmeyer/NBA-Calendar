name: NBA-Kalender aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"    # taeglich ca. 06:17 Uhr deutscher Zeit
    - cron: "17 15 * * *"   # und ca. 16:17 Uhr
  workflow_dispatch:         # erlaubt manuelles Starten im Actions-Tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gefilterten Kalender erzeugen
        run: python nba_kalender.py

      - name: Aenderungen speichern
        run: |
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba.ics .nojekyll
          git commit -m "Kalender aktualisiert" || echo "Keine Aenderungen"
          git push
